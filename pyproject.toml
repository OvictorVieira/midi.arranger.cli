[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-arranger-tools"
version = "0.1.0"
description = "Maquinario deterministico do midi.arranger.cli — analise, plano, render e validacao."
requires-python = ">=3.11"
dependencies = [
    "mido==1.3.3",
    "pretty_midi==0.2.11.post0",
]

[tool.setuptools.packages.find]
include = ["tools*"]
exclude = ["tests*", "scripts*"]
